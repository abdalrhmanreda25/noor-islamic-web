<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>يسر | Noor Islamic Web</title>
    <script>
      (function () {
        var base = window.location.pathname;
        if (!base.endsWith("/")) base += "/";
        var saved = "";
        try {
          saved = localStorage.getItem("yusr.locale") || "";
        } catch (e) {}
        var locale = saved === "en" || saved === "ar" ? saved : "ar";
        window.location.replace(base + locale + "/");
      })();
    </script>
  </head>
  <body>
    <noscript>
      <meta http-equiv="refresh" content="0; url=ar/" />
      <p style="text-align: center; padding: 40px; font-family: sans-serif;">
        جاري التحويل... / Redirecting to <a href="ar/">Arabic</a>...
      </p>
    </noscript>
  </body>
</html>
